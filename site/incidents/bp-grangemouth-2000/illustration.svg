    <path d="M55,72 L62,80 L52,84 L60,88" stroke="#C81E1E" stroke-width="3" fill="none"/>
    <circle cx="58" cy="80" r="4" fill="#C81E1E"/>
        <text x="60" y="160" text-anchor="middle" class="label">1950s Pipe Tee</text>
        <text x="60" y="176" text-anchor="middle" class="label">Failed</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Steam main ruptured near</text>
