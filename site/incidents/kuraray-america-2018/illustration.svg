<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Arial, sans-serif">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #13567F; }
      .sublabel { font-family: Arial, sans-serif; font-size: 11px; fill: #666; }
      .arrow { stroke: #C9D6DE; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="960" height="380" fill="#F5F8FA"/>
  <line x1="178" y1="130" x2="302" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="418" y1="130" x2="542" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="658" y1="130" x2="782" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <g transform="translate(60,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <circle cx="60" cy="75" r="30" fill="#fff" stroke="#13567F" stroke-width="4"/>
    <line x1="60" y1="75" x2="78" y2="58" stroke="#C81E1E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="75" r="4" fill="#13567F"/>
    <rect x="50" y="105" width="20" height="14" rx="3" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">High-Pressure Alarm</text>
        <text x="60" y="176" text-anchor="middle" class="label">Sounds</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Workers were not</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">evacuated from the area</text>
      </g>

  <g transform="translate(300,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <rect x="20" y="72" width="80" height="16" rx="4" fill="#13567F"/>
    <circle cx="60" cy="80" r="20" fill="#E8622C"/>
    <rect x="52" y="60" width="16" height="16" fill="#13567F"/>
    <rect x="46" y="52" width="28" height="10" rx="3" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">Safety Interlock</text>
        <text x="60" y="176" text-anchor="middle" class="label">Disabled</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">A protective system was</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">out of service</text>
      </g>

  <g transform="translate(540,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <ellipse cx="60" cy="72" rx="34" ry="18" fill="#8FA9BC"/>
    <ellipse cx="40" cy="80" rx="20" ry="13" fill="#8FA9BC"/>
    <ellipse cx="82" cy="80" rx="20" ry="13" fill="#8FA9BC"/>
        <text x="60" y="160" text-anchor="middle" class="label">Relief System Vents</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Discharged ethylene</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">toward occupied space</text>
      </g>

  <g transform="translate(780,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <path d="M60,35 C45,55 40,68 48,82 C42,80 38,72 40,64 C36,80 45,100 65,100 C82,100 90,85 82,68 C88,74 88,84 84,90 C92,80 90,60 76,45 C78,55 74,62 68,60 C72,50 68,40 60,35 Z" fill="#E8622C"/>
        <text x="60" y="160" text-anchor="middle" class="label">Fire</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">23 injured, mostly while</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">running to escape</text>
      </g>
  <rect x="0" y="350" width="960" height="30" fill="#13567F"/>
  <text x="480" y="369" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif" font-weight="500">Kuraray America EVAL Plant Ethylene Release and Fire — 0 killed, 23 injured</text>
</svg>