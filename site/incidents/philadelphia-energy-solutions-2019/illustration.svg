<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <style>
      .label { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #13567F; }
      .sublabel { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 11px; fill: #666; }
      .arrow { stroke: #C9D6DE; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="960" height="380" fill="#F5F8FA"/>
  <line x1="178" y1="130" x2="302" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="418" y1="130" x2="542" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="658" y1="130" x2="782" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <g transform="translate(60,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <rect x="20" y="72" width="80" height="16" rx="4" fill="#8FA9BC"/>
    <path d="M55,72 L62,80 L52,84 L60,88" stroke="#C81E1E" stroke-width="3" fill="none"/>
    <circle cx="58" cy="80" r="4" fill="#C81E1E"/>
        <text x="60" y="160" text-anchor="middle" class="label">1973 Pipe Elbow</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Corroded to about 7% of</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">original thickness</text>
      </g>

  <g transform="translate(300,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <circle cx="52" cy="70" r="22" fill="none" stroke="#13567F" stroke-width="6"/>
    <line x1="68" y1="86" x2="88" y2="106" stroke="#13567F" stroke-width="7" stroke-linecap="round"/>
    <rect x="42" y="60" width="20" height="4" fill="#E8622C"/>
    <rect x="42" y="68" width="20" height="4" fill="#E8622C"/>
        <text x="60" y="160" text-anchor="middle" class="label">Outdated Material</text>
        <text x="60" y="176" text-anchor="middle" class="label">Standard</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Alloy hasn't met</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">standards since 1995</text>
      </g>

  <g transform="translate(540,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <path d="M60,35 C45,55 40,68 48,82 C42,80 38,72 40,64 C36,80 45,100 65,100 C82,100 90,85 82,68 C88,74 88,84 84,90 C92,80 90,60 76,45 C78,55 74,62 68,60 C72,50 68,40 60,35 Z" fill="#E8622C"/>
        <text x="60" y="160" text-anchor="middle" class="label">Fire</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">HF mixed with burning</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">hydrocarbons</text>
      </g>

  <g transform="translate(780,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <rect x="30" y="70" width="60" height="35" rx="2" fill="#13567F"/>
    <rect x="38" y="78" width="10" height="10" fill="#F5F8FA"/>
    <rect x="55" y="78" width="10" height="10" fill="#F5F8FA"/>
    <rect x="72" y="78" width="10" height="10" fill="#F5F8FA"/>
    <path d="M25,70 L60,48 L95,70 Z" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">Refinery Permanently</text>
        <text x="60" y="176" text-anchor="middle" class="label">Closed</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">117,000 residents lived</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">within a mile</text>
      </g>
  <rect x="0" y="350" width="960" height="30" fill="#13567F"/>
  <text x="480" y="369" text-anchor="middle" fill="#fff" font-size="12" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="500">Philadelphia Energy Solutions Refinery Fire and HF Release — 0 killed, 5 injured</text>
</svg>