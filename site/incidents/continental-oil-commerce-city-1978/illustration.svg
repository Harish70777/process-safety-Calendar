<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Arial, sans-serif">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #13567F; }
      .sublabel { font-family: Arial, sans-serif; font-size: 11px; fill: #666; }
      .arrow { stroke: #C9D6DE; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="960" height="380" fill="#F5F8FA"/>
  <line x1="178" y1="130" x2="302" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="418" y1="130" x2="542" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="658" y1="130" x2="782" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <g transform="translate(60,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <rect x="20" y="72" width="80" height="16" rx="4" fill="#13567F"/>
    <circle cx="60" cy="80" r="20" fill="#E8622C"/>
    <rect x="52" y="60" width="16" height="16" fill="#13567F"/>
    <rect x="46" y="52" width="28" height="10" rx="3" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">New Unit, 2 Weeks</text>
        <text x="60" y="176" text-anchor="middle" class="label">Old</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Polymerization unit not</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">yet proven out</text>
      </g>

  <g transform="translate(300,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <ellipse cx="60" cy="72" rx="34" ry="18" fill="#8FA9BC"/>
    <ellipse cx="40" cy="80" rx="20" ry="13" fill="#8FA9BC"/>
    <ellipse cx="82" cy="80" rx="20" ry="13" fill="#8FA9BC"/>
        <text x="60" y="160" text-anchor="middle" class="label">Gas Fumes Leak</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">From newly installed</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">equipment</text>
      </g>

  <g transform="translate(540,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <path d="M60,30 L70,55 L95,50 L78,70 L100,90 L72,86 L75,112 L60,92 L45,112 L48,86 L20,90 L42,70 L25,50 L50,55 Z" fill="#E8622C"/>
    <circle cx="60" cy="78" r="14" fill="#C81E1E"/>
        <text x="60" y="160" text-anchor="middle" class="label">Explosion, 3.5 on</text>
        <text x="60" y="176" text-anchor="middle" class="label">Richter Scale</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Flames 60 feet above the</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">stacks</text>
      </g>

  <g transform="translate(780,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <circle cx="60" cy="52" r="14" fill="#13567F"/>
    <path d="M38,105 C38,80 48,70 60,70 C72,70 82,80 82,105 Z" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">3 Killed, 9 Injured</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Same site as later</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">Suncor incidents</text>
      </g>
  <rect x="0" y="350" width="960" height="30" fill="#13567F"/>
  <text x="480" y="369" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif" font-weight="500">Continental Oil Commerce City Polymerization Unit Explosion — 3 killed, 9 injured</text>
</svg>