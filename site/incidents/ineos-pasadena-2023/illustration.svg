        <text x="60" y="160" text-anchor="middle" class="label">0 Killed, 1 Injured</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Driver thrown to the</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">ground</text>
      </g>
  <rect x="0" y="350" width="960" height="30" fill="#13567F"/>
  <text x="480" y="369" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif" font-weight="500">INEOS Phenol Pasadena Tanker BLEVE — 0 killed, 1 injured</text>
