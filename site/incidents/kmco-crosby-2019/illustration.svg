<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <style>
      .label { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #13567F; }
      .sublabel { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 11px; fill: #666; }
      .arrow { stroke: #C9D6DE; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="960" height="380" fill="#F5F8FA"/>
  <line x1="178" y1="130" x2="302" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="418" y1="130" x2="542" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="658" y1="130" x2="782" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <g transform="translate(60,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <rect x="20" y="72" width="80" height="16" rx="4" fill="#8FA9BC"/>
    <path d="M55,72 L62,80 L52,84 L60,88" stroke="#C81E1E" stroke-width="3" fill="none"/>
    <circle cx="58" cy="80" r="4" fill="#C81E1E"/>
        <text x="60" y="160" text-anchor="middle" class="label">Brittle Cast-Iron</text>
        <text x="60" y="176" text-anchor="middle" class="label">Strainer</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Material not suited for</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">this pressurized service</text>
      </g>

  <g transform="translate(300,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <ellipse cx="60" cy="72" rx="34" ry="18" fill="#8FA9BC"/>
    <ellipse cx="40" cy="80" rx="20" ry="13" fill="#8FA9BC"/>
    <ellipse cx="82" cy="80" rx="20" ry="13" fill="#8FA9BC"/>
        <text x="60" y="160" text-anchor="middle" class="label">Isobutylene Release</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Strainer ruptured,</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">formed a vapor cloud</text>
      </g>

  <g transform="translate(540,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <path d="M60,35 L95,100 L25,100 Z" fill="#E8622C"/>
    <rect x="56" y="58" width="8" height="24" rx="3" fill="#F5F8FA"/>
    <circle cx="60" cy="90" r="4" fill="#F5F8FA"/>
        <text x="60" y="160" text-anchor="middle" class="label">Trainee Approached</text>
        <text x="60" y="176" text-anchor="middle" class="label">the Cloud</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Culture expected</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">operators to intervene</text>
      </g>

  <g transform="translate(780,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <path d="M60,30 L70,55 L95,50 L78,70 L100,90 L72,86 L75,112 L60,92 L45,112 L48,86 L20,90 L42,70 L25,50 L50,55 Z" fill="#E8622C"/>
    <circle cx="60" cy="78" r="14" fill="#C81E1E"/>
        <text x="60" y="160" text-anchor="middle" class="label">Explosion</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">At least 28 injured</text>
      </g>
  <rect x="0" y="350" width="960" height="30" fill="#13567F"/>
  <text x="480" y="369" text-anchor="middle" fill="#fff" font-size="12" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="500">KMCO Chemical Facility Fatal Explosion and Fire — 1 killed, 28 injured</text>
</svg>