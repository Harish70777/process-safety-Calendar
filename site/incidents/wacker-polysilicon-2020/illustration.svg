<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <style>
      .label { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #13567F; }
      .sublabel { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 11px; fill: #666; }
      .arrow { stroke: #C9D6DE; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="960" height="380" fill="#F5F8FA"/>
  <line x1="178" y1="130" x2="302" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="418" y1="130" x2="542" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="658" y1="130" x2="782" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <g transform="translate(60,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <rect x="20" y="72" width="80" height="16" rx="4" fill="#13567F"/>
    <circle cx="60" cy="80" r="20" fill="#E8622C"/>
    <rect x="52" y="60" width="16" height="16" fill="#13567F"/>
    <rect x="46" y="52" width="28" height="10" rx="3" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">No Written Torque</text>
        <text x="60" y="176" text-anchor="middle" class="label">Procedure</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">A contract crew</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">over-torqued a flange</text>
        <text x="60" y="224" text-anchor="middle" class="sublabel">bolt</text>
      </g>

  <g transform="translate(300,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <ellipse cx="60" cy="72" rx="34" ry="18" fill="#8FA9BC"/>
    <ellipse cx="40" cy="80" rx="20" ry="13" fill="#8FA9BC"/>
    <ellipse cx="82" cy="80" rx="20" ry="13" fill="#8FA9BC"/>
        <text x="60" y="160" text-anchor="middle" class="label">HCl Cloud Forms</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">A nearby crew had no</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">chemical protection</text>
      </g>

  <g transform="translate(540,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <path d="M60,35 L95,100 L25,100 Z" fill="#E8622C"/>
    <rect x="56" y="58" width="8" height="24" rx="3" fill="#F5F8FA"/>
    <circle cx="60" cy="90" r="4" fill="#F5F8FA"/>
        <text x="60" y="160" text-anchor="middle" class="label">Single Means of</text>
        <text x="60" y="176" text-anchor="middle" class="label">Egress</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Flagged 3 months</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">earlier, left</text>
        <text x="60" y="224" text-anchor="middle" class="sublabel">unaddressed</text>
      </g>

  <g transform="translate(780,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <circle cx="60" cy="52" r="14" fill="#13567F"/>
    <path d="M38,105 C38,80 48,70 60,70 C72,70 82,80 82,105 Z" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">Workers Fall 70 Feet</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Trying to escape the gas</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">cloud</text>
      </g>
  <rect x="0" y="350" width="960" height="30" fill="#13567F"/>
  <text x="480" y="369" text-anchor="middle" fill="#fff" font-size="12" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="500">Wacker Polysilicon Hydrogen Chloride Release — 1 killed, 4 injured</text>
</svg>