<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Arial, sans-serif">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #13567F; }
      .sublabel { font-family: Arial, sans-serif; font-size: 11px; fill: #666; }
      .arrow { stroke: #C9D6DE; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="960" height="380" fill="#F5F8FA"/>
  <line x1="178" y1="130" x2="302" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="418" y1="130" x2="542" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="658" y1="130" x2="782" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <g transform="translate(60,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <rect x="20" y="72" width="80" height="16" rx="4" fill="#8FA9BC"/>
    <path d="M55,72 L62,80 L52,84 L60,88" stroke="#C81E1E" stroke-width="3" fill="none"/>
    <circle cx="58" cy="80" r="4" fill="#C81E1E"/>
        <text x="60" y="160" text-anchor="middle" class="label">Welding Defect</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Flaw present since</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">original construction</text>
      </g>

  <g transform="translate(300,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <rect x="28" y="55" width="64" height="55" rx="8" fill="#13567F"/>
    <ellipse cx="60" cy="55" rx="32" ry="10" fill="#3A7CA5"/>
    <line x1="28" y1="80" x2="92" y2="80" stroke="#E8622C" stroke-width="3"/>
        <text x="60" y="160" text-anchor="middle" class="label">Tank Splits Open</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">2.1 million gallons</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">released almost</text>
        <text x="60" y="208" text-anchor="middle" class="sublabel">instantly</text>
      </g>

  <g transform="translate(540,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <circle cx="60" cy="52" r="14" fill="#13567F"/>
    <path d="M38,105 C38,80 48,70 60,70 C72,70 82,80 82,105 Z" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">Workers Caught</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Welder and helper</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">immersed in fertilizer</text>
      </g>

  <g transform="translate(780,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <rect x="30" y="70" width="60" height="35" rx="2" fill="#13567F"/>
    <rect x="38" y="78" width="10" height="10" fill="#F5F8FA"/>
    <rect x="55" y="78" width="10" height="10" fill="#F5F8FA"/>
    <rect x="72" y="78" width="10" height="10" fill="#F5F8FA"/>
    <path d="M25,70 L60,48 L95,70 Z" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">Community Reached</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Flooded a road, reached</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">a neighborhood</text>
      </g>
  <rect x="0" y="350" width="960" height="30" fill="#13567F"/>
  <text x="480" y="369" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif" font-weight="500">Allied Terminals Fertilizer Tank Collapse — 0 killed, 2 injured</text>
</svg>