    <rect x="56" y="58" width="8" height="24" rx="3" fill="#F5F8FA"/>
    <circle cx="60" cy="90" r="4" fill="#F5F8FA"/>
        <text x="60" y="160" text-anchor="middle" class="label">Supplier Withheld a</text>
        <text x="60" y="176" text-anchor="middle" class="label">Warning</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Borden knew of a 1999</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">explosion, didn't say</text>
      </g>

  <g transform="translate(540,50)">
        
