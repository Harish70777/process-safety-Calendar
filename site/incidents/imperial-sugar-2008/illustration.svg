<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <style>
      .label { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #13567F; }
      .sublabel { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 11px; fill: #666; }
      .arrow { stroke: #C9D6DE; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="960" height="380" fill="#F5F8FA"/>
  <line x1="178" y1="130" x2="302" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="418" y1="130" x2="542" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="658" y1="130" x2="782" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <g transform="translate(60,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <ellipse cx="60" cy="72" rx="34" ry="18" fill="#C9A876"/>
    <ellipse cx="40" cy="80" rx="20" ry="13" fill="#C9A876"/>
    <ellipse cx="82" cy="80" rx="20" ry="13" fill="#C9A876"/>
        <text x="60" y="160" text-anchor="middle" class="label">Dust Accumulation</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Inches-thick sugar dust</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">on horizontal surfaces</text>
      </g>

  <g transform="translate(300,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <rect x="20" y="72" width="80" height="16" rx="4" fill="#13567F"/>
    <circle cx="60" cy="80" r="20" fill="#E8622C"/>
    <rect x="52" y="60" width="16" height="16" fill="#13567F"/>
    <rect x="46" y="52" width="28" height="10" rx="3" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">Enclosure Created</text>
        <text x="60" y="176" text-anchor="middle" class="label">Hazard</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">New panels let dust</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">reach explosive levels</text>
      </g>

  <g transform="translate(540,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <path d="M60,30 L70,55 L95,50 L78,70 L100,90 L72,86 L75,112 L60,92 L45,112 L48,86 L20,90 L42,70 L25,50 L50,55 Z" fill="#E8622C"/>
    <circle cx="60" cy="78" r="14" fill="#C81E1E"/>
        <text x="60" y="160" text-anchor="middle" class="label">Primary Explosion</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Ignited inside the</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">enclosed conveyor space</text>
      </g>

  <g transform="translate(780,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <path d="M60,35 C45,55 40,68 48,82 C42,80 38,72 40,64 C36,80 45,100 65,100 C82,100 90,85 82,68 C88,74 88,84 84,90 C92,80 90,60 76,45 C78,55 74,62 68,60 C72,50 68,40 60,35 Z" fill="#E8622C"/>
        <text x="60" y="160" text-anchor="middle" class="label">Cascading Explosions</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Blast wave lofted dust</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">throughout the facility</text>
      </g>
  <rect x="0" y="350" width="960" height="30" fill="#13567F"/>
  <text x="480" y="369" text-anchor="middle" fill="#fff" font-size="12" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="500">Imperial Sugar Refinery Dust Explosion — 14 killed, 36 injured</text>
</svg>