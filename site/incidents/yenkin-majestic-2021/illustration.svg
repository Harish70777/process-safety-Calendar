<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Arial, sans-serif">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #13567F; }
      .sublabel { font-family: Arial, sans-serif; font-size: 11px; fill: #666; }
      .arrow { stroke: #C9D6DE; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="960" height="380" fill="#F5F8FA"/>
  <line x1="178" y1="130" x2="302" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="418" y1="130" x2="542" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <line x1="658" y1="130" x2="782" y2="130" class="arrow" stroke-dasharray="4 5"/>
  <g transform="translate(60,50)">
        
    <circle cx="60" cy="80" r="58" fill="#DCE9F2"/>
    <rect x="20" y="72" width="80" height="16" rx="4" fill="#13567F"/>
    <circle cx="60" cy="80" r="20" fill="#E8622C"/>
    <rect x="52" y="60" width="16" height="16" fill="#13567F"/>
    <rect x="46" y="52" width="28" height="10" rx="3" fill="#13567F"/>
        <text x="60" y="160" text-anchor="middle" class="label">Manway Not Pressure</text>
        <text x="60" y="176" text-anchor="middle" class="label">Tested</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Installed just 3 months</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">before the incident</text>
      </g>

  <g transform="translate(300,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <path d="M60,35 L95,100 L25,100 Z" fill="#E8622C"/>
    <rect x="56" y="58" width="8" height="24" rx="3" fill="#F5F8FA"/>
    <circle cx="60" cy="90" r="4" fill="#F5F8FA"/>
        <text x="60" y="160" text-anchor="middle" class="label">Procedure Violated</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Solvent was added with</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">the agitator off</text>
      </g>

  <g transform="translate(540,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <rect x="38" y="45" width="44" height="75" rx="6" fill="#E8622C"/>
    <rect x="46" y="52" width="28" height="6" rx="3" fill="#FBE3D6"/>
    <rect x="46" y="63" width="28" height="6" rx="3" fill="#FBE3D6"/>
    <rect x="46" y="74" width="28" height="6" rx="3" fill="#FBE3D6"/>
    <path d="M60,38 L52,26 L68,26 Z" fill="#E8622C"/>
    <line x1="30" y1="38" x2="90" y2="38" stroke="#C81E1E" stroke-width="2" stroke-dasharray="3 3"/>
        <text x="60" y="160" text-anchor="middle" class="label">Pressure Builds</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">Sudden mixing rapidly</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">vaporized the solvent</text>
      </g>

  <g transform="translate(780,50)">
        
    <circle cx="60" cy="80" r="58" fill="#FBE3D6"/>
    <path d="M60,30 L70,55 L95,50 L78,70 L100,90 L72,86 L75,112 L60,92 L45,112 L48,86 L20,90 L42,70 L25,50 L50,55 Z" fill="#E8622C"/>
    <circle cx="60" cy="78" r="14" fill="#C81E1E"/>
        <text x="60" y="160" text-anchor="middle" class="label">Explosion &amp; Fire</text>
        <text x="60" y="182" text-anchor="middle" class="sublabel">1 killed, 8 injured,</text>
        <text x="60" y="195" text-anchor="middle" class="sublabel">burned 11 hours</text>
      </g>
  <rect x="0" y="350" width="960" height="30" fill="#13567F"/>
  <text x="480" y="369" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif" font-weight="500">Yenkin-Majestic Resin Plant Vapor Cloud Explosion and Fire — 1 killed, 8 injured</text>
</svg>