  <rect x="0" y="350" width="960" height="30" fill="#13567F"/>
  <text x="480" y="369" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif" font-weight="500">Bio-Lab Chemical Fire and Toxic Gas Release (Hurricane Laura) — 0 killed, 0 injured</text>
