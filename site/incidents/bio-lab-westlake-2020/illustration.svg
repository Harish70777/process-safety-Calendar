    <ellipse cx="82" cy="80" rx="20" ry="13" fill="#8FA9BC"/>
        <text x="60" y="160" text-anchor="middle" class="label">Rainwater Reaches</text>
        <text x="60" y="176" text-anchor="middle" class="label">TCCA</text>
        <text x="60" y="198" text-anchor="middle" class="sublabel">Wetting triggers heat</text>
        <text x="60" y="211" text-anchor="middle" class="sublabel">and chlorine gas</text>
