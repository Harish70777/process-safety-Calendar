      </g>
  <rect x="0" y="290" width="960" height="30" fill="#13567F"/>
  <text x="480" y="309" text-anchor="middle" fill="#fff" font-size="12" font-family="'Poppins', sans-serif" font-weight="500">Piper Alpha Offshore Platform Explosion — 167 killed, 61 injured</text>
