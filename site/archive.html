<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Incident Archive — Process Safety Calendar</title>
<meta name="description" content="Search and filter the full archive of historical process safety incidents, or browse them by month in the calendar view.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF3F5; --ink:#101820; --blueprint:#0B4F6C;
    --amber:#F2A900; --red:#C81E1E; --line:#C7D0D6; --paper-card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans', sans-serif;line-height:1.5;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  header{border-bottom:1px solid var(--line);padding:20px 0;}
  header .wrap{display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:'IBM Plex Mono', monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);}
  .brand .dot{width:8px;height:8px;background:var(--amber);border:1px solid var(--ink);}
  nav a{font-family:'IBM Plex Mono', monospace;font-size:13px;color:var(--ink);text-decoration:none;margin-left:24px;border-bottom:1px solid transparent;}
  nav a:hover{border-bottom-color:var(--ink);}

  main{padding:40px 0 64px;}
  .eyebrow{font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--blueprint);margin-bottom:10px;}
  h1{font-family:'Space Grotesk', sans-serif;font-weight:700;font-size:32px;line-height:1.15;margin:0 0 10px;}
  .count{font-family:'IBM Plex Mono', monospace;font-size:13px;color:#555;margin-bottom:28px;}

  /* Controls */
  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-bottom:24px; padding:16px; background:var(--paper-card);
    border:1px solid var(--line);
  }
  .controls input[type="text"], .controls select{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }
  .controls input[type="text"]{flex:1 1 220px; min-width:180px;}
  .controls select{flex:0 1 auto;}
  .view-toggle{display:flex; margin-left:auto; border:1px solid var(--ink);}
  .view-toggle button{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.03em;
    padding:8px 14px; background:var(--paper-card); color:var(--ink); border:none; cursor:pointer;
  }
  .view-toggle button.active{background:var(--ink); color:var(--paper);}
  .view-toggle button:first-child{border-right:1px solid var(--ink);}
  .result-count{font-family:'IBM Plex Mono', monospace; font-size:12px; color:#666; margin-bottom:16px;}

  /* List view (table) */
  table{width:100%; border-collapse:collapse; background:var(--paper-card); border:1px solid var(--line);}
  thead th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--blueprint); padding:10px 14px; border-bottom:1px solid var(--line); background:var(--paper);
  }
  tbody tr{border-bottom:1px solid var(--line); cursor:pointer;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--paper);}
  tbody td{padding:12px 14px; font-size:14px; vertical-align:top;}
  td.date-cell{font-family:'IBM Plex Mono', monospace; font-size:13px; color:#555; white-space:nowrap;}
  td.title-cell a{color:var(--ink); text-decoration:none; font-weight:500;}
  td.title-cell a:hover{text-decoration:underline;}
  td.loc-cell{color:#555; font-size:13px;}
  td.tags-cell{font-size:12px; color:#666;}
  .row-sev1{border-left:3px solid var(--red);}

  /* Calendar view */
  .cal-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
  @media (max-width:800px){ .cal-grid{grid-template-columns:repeat(2, 1fr);} }
  @media (max-width:520px){ .cal-grid{grid-template-columns:1fr;} }
  .cal-month{background:var(--paper-card); border:1px solid var(--line); padding:14px;}
  .cal-month h4{
    font-family:'Space Grotesk', sans-serif; font-size:16px; margin:0 0 10px;
    padding-bottom:8px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline;
  }
  .cal-month h4 .cal-count{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--blueprint); font-weight:400;}
  .cal-entry{display:block; padding:6px 0; border-bottom:1px dotted var(--line); text-decoration:none; color:var(--ink);}
  .cal-entry:last-child{border-bottom:none;}
  .cal-entry:hover .cal-entry-title{text-decoration:underline;}
  .cal-day{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--blueprint); display:block;}
  .cal-entry-title{font-size:13px;}
  .cal-empty{font-size:13px; color:#999; font-style:italic;}

  .no-results{padding:40px 20px; text-align:center; color:#666; font-size:14px; background:var(--paper-card); border:1px solid var(--line);}

  @media (max-width:600px){
    h1{font-size:26px;}
    .controls{flex-direction:column; align-items:stretch;}
    .view-toggle{margin-left:0;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="./"><span class="dot"></span> Process Safety Calendar</a>
    <nav>
      <a href="./#subscribe">Subscribe</a>
      <a href="archive.html">Archive</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="eyebrow">Every incident, searchable</div>
    <h1>Full Incident Archive</h1>
    <div class="count" id="total-count">Loading…</div>

    <div class="controls">
      <input type="text" id="search-input" placeholder="Search by name or location…">
      <select id="industry-filter"><option value="">All industries</option></select>
      <select id="tag-filter"><option value="">All PSM elements</option></select>
      <select id="sort-select">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="az">A–Z</option>
      </select>
      <div class="view-toggle">
        <button id="btn-list" class="active" type="button">List</button>
        <button id="btn-calendar" type="button">Calendar</button>
      </div>
    </div>

    <div class="result-count" id="result-count"></div>

    <div id="list-view">
      <table>
        <thead>
          <tr><th>Date</th><th>Incident</th><th>Location</th><th>PSM Elements</th></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="no-results" id="no-results" style="display:none;">No incidents match your filters.</div>
    </div>

    <div id="calendar-view" style="display:none;">
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
</main>

<script src="incidents-data.js"></script>
<script>
  (function() {
    var data = window.INCIDENTS || [];
    var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    document.getElementById("total-count").textContent = data.length + " incidents and counting";

    // Populate filter dropdowns from actual data
    function uniqueSorted(arr) {
      return Array.from(new Set(arr)).sort();
    }
    var industries = uniqueSorted(data.flatMap(function(d) { return d.industry || []; }));
    var tags = uniqueSorted(data.flatMap(function(d) { return d.psm_elements || []; }));

    var industrySelect = document.getElementById("industry-filter");
    industries.forEach(function(i) {
      var opt = document.createElement("option");
      opt.value = i; opt.textContent = humanize(i);
      industrySelect.appendChild(opt);
    });
    var tagSelect = document.getElementById("tag-filter");
    tags.forEach(function(t) {
      var opt = document.createElement("option");
      opt.value = t; opt.textContent = humanize(t);
      tagSelect.appendChild(opt);
    });

    var searchInput = document.getElementById("search-input");
    var sortSelect = document.getElementById("sort-select");
    var tableBody = document.getElementById("table-body");
    var noResults = document.getElementById("no-results");
    var resultCount = document.getElementById("result-count");
    var listView = document.getElementById("list-view");
    var calendarView = document.getElementById("calendar-view");
    var calGrid = document.getElementById("cal-grid");
    var btnList = document.getElementById("btn-list");
    var btnCalendar = document.getElementById("btn-calendar");

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s || "";
      return d.innerHTML;
    }

    function humanize(slug) {
      var overrides = {
        "oil-gas-refining": "Oil & Gas Refining",
        "offshore-oil-gas": "Offshore Oil & Gas",
        "oil-gas-terminal-logistics": "Oil & Gas Terminal Logistics",
        "food-beverage-manufacturing": "Food & Beverage Manufacturing",
        "pulp-paper-manufacturing": "Pulp & Paper Manufacturing",
        "chemical-storage-distribution": "Chemical Storage & Distribution",
        "fertilizer-storage-distribution": "Fertilizer Storage & Distribution"
      };
      if (overrides[slug]) return overrides[slug];
      return String(slug || "")
        .split("-")
        .map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); })
        .join(" ");
    }

    function filtered() {
      var q = searchInput.value.trim().toLowerCase();
      var ind = industrySelect.value;
      var tag = tagSelect.value;

      var result = data.filter(function(d) {
        if (ind && (d.industry || []).indexOf(ind) === -1) return false;
        if (tag && (d.psm_elements || []).indexOf(tag) === -1) return false;
        if (q) {
          var hay = (d.title + " " + d.location).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });

      var sortMode = sortSelect.value;
      result.sort(function(a, b) {
        if (sortMode === "date-asc") return new Date(a.date) - new Date(b.date);
        if (sortMode === "az") return a.title.localeCompare(b.title);
        return new Date(b.date) - new Date(a.date); // date-desc default
      });

      return result;
    }

    function renderList() {
      var rows = filtered();
      resultCount.textContent = rows.length + " of " + data.length + " shown";
      tableBody.innerHTML = "";
      noResults.style.display = rows.length ? "none" : "block";

      rows.forEach(function(d) {
        var dt = new Date(d.date);
        var dateStr = String(dt.getUTCMonth() + 1).padStart(2, "0") + "." +
                      String(dt.getUTCDate()).padStart(2, "0") + "." + dt.getUTCFullYear();
        var tagsStr = (d.psm_elements || []).slice(0, 3).map(humanize).join(", ");
        var tr = document.createElement("tr");
        if (d.severity === 1) tr.className = "row-sev1";
        tr.innerHTML =
          '<td class="date-cell">' + dateStr + '</td>' +
          '<td class="title-cell"><a href="incidents/' + esc(d.id) + '/">' + esc(d.title) + '</a></td>' +
          '<td class="loc-cell">' + esc(d.location) + '</td>' +
          '<td class="tags-cell">' + esc(tagsStr) + '</td>';
        tr.addEventListener("click", function(e) {
          if (e.target.tagName !== "A") window.location.href = "incidents/" + d.id + "/";
        });
        tableBody.appendChild(tr);
      });
    }

    function renderCalendar() {
      var rows = filtered();
      resultCount.textContent = rows.length + " of " + data.length + " shown";

      var byMonth = {};
      for (var m = 0; m < 12; m++) byMonth[m] = [];
      rows.forEach(function(d) {
        var dt = new Date(d.date);
        byMonth[dt.getUTCMonth()].push(d);
      });

      calGrid.innerHTML = "";
      for (var m = 0; m < 12; m++) {
        var entries = byMonth[m].sort(function(a, b) {
          return new Date(a.date).getUTCDate() - new Date(b.date).getUTCDate();
        });
        var monthDiv = document.createElement("div");
        monthDiv.className = "cal-month";
        var header = '<h4>' + MONTHS[m] + ' <span class="cal-count">' + entries.length + '</span></h4>';
        var body = "";
        if (entries.length === 0) {
          body = '<div class="cal-empty">No incidents</div>';
        } else {
          entries.forEach(function(d) {
            var dt = new Date(d.date);
            var dayStr = String(dt.getUTCDate()).padStart(2, "0") + "." + dt.getUTCFullYear();
            body += '<a class="cal-entry" href="incidents/' + esc(d.id) + '/">' +
                    '<span class="cal-day">' + dayStr + '</span>' +
                    '<span class="cal-entry-title">' + esc(d.title) + '</span></a>';
          });
        }
        monthDiv.innerHTML = header + body;
        calGrid.appendChild(monthDiv);
      }
    }

    function renderAll() {
      if (listView.style.display !== "none") renderList();
      else renderCalendar();
    }

    searchInput.addEventListener("input", renderAll);
    industrySelect.addEventListener("change", renderAll);
    tagSelect.addEventListener("change", renderAll);
    sortSelect.addEventListener("change", renderAll);

    btnList.addEventListener("click", function() {
      btnList.classList.add("active"); btnCalendar.classList.remove("active");
      listView.style.display = ""; calendarView.style.display = "none";
      renderList();
    });
    btnCalendar.addEventListener("click", function() {
      btnCalendar.classList.add("active"); btnList.classList.remove("active");
      calendarView.style.display = ""; listView.style.display = "none";
      renderCalendar();
    });

    renderList();
  })();
</script>

</body>
</html>
