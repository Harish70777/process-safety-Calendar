name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'incidents/**'
      - 'scripts/**'
      - 'site/index.html'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build index, calendar, and site
        run: npm run build

      - name: Fail the build on data quality issues
        run: |
          if grep -q "⚠️" index-report.txt; then
            echo "Data quality issues found — see below:"
            cat index-report.txt
            exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
